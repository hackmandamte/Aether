name: Apply update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the update zip
        run: |
          ZIP="$(ls aether-update-*.zip 2>/dev/null | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No aether-update-*.zip found in the repo."
            echo "This workflow only unpacks a packaged update zip — it is not the APK builder."
            echo "To build the phone app, run workflow: Build Aether APK"
            echo "A previous successful Apply update removes the zip on purpose."
            exit 1
          fi
          echo "Using $ZIP"
          unzip -o "$ZIP" -x '.github/*'
          rm -f aether-update-*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply seamless update" || echo "Nothing to commit"
          git push
