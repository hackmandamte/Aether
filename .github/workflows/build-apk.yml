name: Build Aether APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/aether.keystore
            ALIAS="$KEY_ALIAS"; SPASS="$KS_PASS"; KPASS="$KEY_PASS"
          else
            echo "::warning::No saved signing key; using a one-off key for this build."
            SPASS="$(openssl rand -base64 33 | tr -d '/+=\n' | cut -c1-32)"
            KPASS="$SPASS"; ALIAS="aether"
            export SPASS
            keytool -genkeypair -keystore app/aether.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass:env SPASS -keypass:env SPASS -dname "CN=Aether, O=Personal"
          fi
          {
            echo "storeFile=aether.keystore"
            echo "storePassword=$SPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KPASS"
          } > keystore.properties
      - name: Build
        env:
          AETHER_SITE_URL: ${{ secrets.AETHER_SITE_URL }}
          AETHER_ACCESS_CODE: ${{ secrets.AETHER_ACCESS_CODE }}
        run: |
          if [ -z "$AETHER_SITE_URL" ]; then
            echo "::warning::AETHER_SITE_URL secret is not set; the app may ask for the site link on first open."
          fi
          if [ -z "$AETHER_ACCESS_CODE" ]; then
            echo "::error::AETHER_ACCESS_CODE secret is required. The APK must bake the same code as the server so users never type it."
            exit 1
          fi
          if [ "${#AETHER_ACCESS_CODE}" -lt 16 ]; then
            echo "::error::AETHER_ACCESS_CODE must be at least 16 characters."
            exit 1
          fi
          gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Aether.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-apk
          path: Aether.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Aether.apk \
            --title "ETA APK #${{ github.run_number }}" \
            --notes "Signed ETA APK. Install on your phone. Access is built in — no code to type."
