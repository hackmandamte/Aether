name: Build Aether APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fetch offline English STT model (~40MB)
        run: |
          set -e
          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 -o /tmp/vosk-en.zip "$MODEL_URL"
          rm -rf android/app/src/main/assets/model-en-us
          unzip -q /tmp/vosk-en.zip -d /tmp/vosk-en
          # Zip root is vosk-model-small-en-us-0.15/
          SRC=$(find /tmp/vosk-en -maxdepth 1 -type d -name 'vosk-model*' | head -1)
          mv "$SRC" android/app/src/main/assets/model-en-us
          # Sanity: acoustic model present
          test -f android/app/src/main/assets/model-en-us/am/final.mdl \
            || test -f android/app/src/main/assets/model-en-us/conf/model.conf
          du -sh android/app/src/main/assets/model-en-us
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/aether.keystore
            ALIAS="$KEY_ALIAS"; SPASS="$KS_PASS"; KPASS="$KEY_PASS"
          else
            echo "::warning::No saved signing key; using a one-off key for this build."
            SPASS="$(openssl rand -base64 33 | tr -d '/+=\n' | cut -c1-32)"
            KPASS="$SPASS"; ALIAS="aether"
            export SPASS
            keytool -genkeypair -keystore app/aether.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass:env SPASS -keypass:env SPASS -dname "CN=ETA, O=Personal"
          fi
          {
            echo "storeFile=aether.keystore"
            echo "storePassword=$SPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KPASS"
          } > keystore.properties
      - name: Build
        env:
          AETHER_SITE_URL: ${{ secrets.AETHER_SITE_URL }}
          AETHER_ACCESS_CODE: ${{ secrets.AETHER_ACCESS_CODE }}
        run: |
          if [ -z "$AETHER_SITE_URL" ]; then
            echo "::warning::AETHER_SITE_URL secret is not set; the app may ask for the site link on first open."
          fi
          if [ -z "$AETHER_ACCESS_CODE" ]; then
            echo "::error::AETHER_ACCESS_CODE secret is required."
            exit 1
          fi
          if [ "${#AETHER_ACCESS_CODE}" -lt 16 ]; then
            echo "::error::AETHER_ACCESS_CODE must be at least 16 characters."
            exit 1
          fi
          gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ETA.apk
          ls -lh ETA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ETA-apk
          path: ETA.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" ETA.apk \
            --title "ETA APK #${{ github.run_number }}" \
            --notes "Signed ETA APK with offline English STT (Vosk). Access is baked in — no code to type. Size may be ~50–100 MB."
