plugins {
    id "com.android.application"
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def bakedSetting = { String envName, String propName ->
    def value = (System.getenv(envName) ?: project.findProperty(propName) ?: "").toString().trim()
    if (!(value ==~ /[A-Za-z0-9+\/=_.:\-]*/)) {
        throw new GradleException("$envName may only contain letters, numbers and + / = _ . : -")
    }
    return value
}
def siteUrl = bakedSetting("AETHER_SITE_URL", "aetherSiteUrl")
def accessCode = bakedSetting("AETHER_ACCESS_CODE", "aetherAccessCode")

android {
    namespace "app.aether.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "app.aether.assistant"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
        buildConfigField "String", "ACCESS_CODE", "\"${accessCode}\""

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"]) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
    // Offline speech recognition (native). Model is downloaded into assets at CI build time.
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0@aar"
}
