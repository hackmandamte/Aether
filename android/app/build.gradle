plugins {
    id "com.android.application"
}

// Signing secrets live in android/keystore.properties (git-ignored), never in this file.
// Create them with: sh scripts/make-keystore.sh
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Optional build-time settings that make the app connect by itself (no setup screen, no
// code to type). They are compiled into the APK, so keep the APK private.
//   AETHER_SITE_URL      e.g. https://your-project.vercel.app
//   AETHER_ACCESS_CODE   the same value as AETHER_ACCESS_CODE on the server
def bakedSetting = { String envName, String propName ->
    def value = (System.getenv(envName) ?: project.findProperty(propName) ?: "").toString().trim()
    if (!(value ==~ /[A-Za-z0-9+\/=_.:\-]*/)) {
        throw new GradleException("$envName may only contain letters, numbers and + / = _ . : -")
    }
    return value
}
def siteUrl = bakedSetting("AETHER_SITE_URL", "aetherSiteUrl")
def accessCode = bakedSetting("AETHER_ACCESS_CODE", "aetherAccessCode")

android {
    namespace "app.aether.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "app.aether.assistant"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
        buildConfigField "String", "ACCESS_CODE", "\"${accessCode}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"]) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
}
